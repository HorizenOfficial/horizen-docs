name: Build

on:
  pull_request:
    branches:
      - main
  # Also build after merge so two independently-green PRs can't combine into a broken main.
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: the job only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same PR or branch. Falls back to the git ref
# for push / workflow_dispatch events, where there is no pull_request number.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
